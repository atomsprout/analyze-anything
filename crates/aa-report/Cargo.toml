[package]
name = "aa-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["pdf"]
# PDF output through an embedded Typst and two embedded fonts. Adds about 30 MB to the binary.
pdf = ["dep:typst", "dep:typst-pdf"]

[dependencies]
aa-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
typst = { version = "0.14.2", optional = true }
typst-pdf = { version = "0.14.2", optional = true }

[dev-dependencies]
aa-engine.workspace = true
zip.workspace = true
tar.workspace = true
