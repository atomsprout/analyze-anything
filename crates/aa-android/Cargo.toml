[package]
name = "aa-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aa-core.workspace = true
serde_json.workspace = true
hex.workspace = true
flate2.workspace = true
sha2 = { workspace = true, features = ["oid"] }
sha1 = { workspace = true, features = ["oid"] }
md-5 = { workspace = true, features = ["oid"] }
base64 = "0.22"
# Signature verification (RustCrypto; MIT OR Apache-2.0).
rsa = { version = "0.9", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["std", "ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["std", "ecdsa"] }
p521 = { version = "0.13", default-features = false, features = ["std", "ecdsa"] }
dsa = { version = "0.6", default-features = false }
