[package]
name = "aa-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aa-core.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true
flate2.workspace = true
# RSA and ECDSA verification of Authenticode signatures (RustCrypto; MIT OR Apache-2.0).
rsa = { version = "0.9", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# Manifest and AppxManifest XML (MIT OR Apache-2.0).
roxmltree = "0.20"
# NSIS installers: header, script and embedded files (Apache-2.0).
nsis = "0.6.1"
# Inno Setup installers: headers, record streams and file extraction (Apache-2.0).
innospect = "0.2"
# MSI databases and cabinets (MIT).
msi = "0.11"
cfb = "0.16"
lzxd = "0.2"
memchr = "2"
regex.workspace = true
base64 = "0.22"

[dev-dependencies]
aa-unpack.workspace = true
zip.workspace = true
