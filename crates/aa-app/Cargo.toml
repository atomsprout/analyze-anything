[package]
name = "aa-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["pdf"]
# PDF output. Leave it out for a much smaller program.
pdf = ["aa-report/pdf"]

[dependencies]
aa-core.workspace = true
aa-engine.workspace = true
aa-export.workspace = true
aa-worker.workspace = true
aa-report = { path = "../aa-report", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# A worker and nothing else, for this crate's tests to start.
[[bin]]
name = "aa-app-worker"
path = "src/worker_main.rs"

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
