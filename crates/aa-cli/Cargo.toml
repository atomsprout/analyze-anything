[package]
name = "aa-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["pdf", "ai"]
# PDF output. Leave it out (`--no-default-features`) for a much smaller binary.
pdf = ["aa-app/pdf"]
# `analyze-anything interpret`: asks a language model to explain a report. The only part that uses the network;
# leave it out and the program cannot connect to anything.
ai = ["dep:aa-interpret"]

[dependencies]
aa-core.workspace = true
aa-engine.workspace = true
aa-app.workspace = true
aa-report = { path = "../aa-report", default-features = false }
aa-export.workspace = true
aa-interpret = { workspace = true, optional = true }
aa-content.workspace = true
serde_json.workspace = true
clap.workspace = true

[[bin]]
name = "analyze-anything"
path = "src/main.rs"
