[package]
name = "aa-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["pdf"]
# PDF output. Leave it out (`--no-default-features`) for a much smaller binary.
pdf = ["aa-report/pdf"]

[dependencies]
aa-core.workspace = true
aa-engine.workspace = true
aa-report = { path = "../aa-report", default-features = false }
aa-export.workspace = true
serde_json.workspace = true
clap.workspace = true

[[bin]]
name = "aa"
path = "src/main.rs"
