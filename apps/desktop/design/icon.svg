<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.6" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>
  <!-- The rounded square of a macOS icon, with the margin the system expects around it. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- A package seen from the front: layers of what is inside. -->
  <g fill="#2b2118">
    <rect x="262" y="300" width="330" height="62" rx="20"/>
    <rect x="262" y="400" width="250" height="62" rx="20" opacity="0.75"/>
    <rect x="262" y="500" width="290" height="62" rx="20" opacity="0.55"/>
    <rect x="262" y="600" width="200" height="62" rx="20" opacity="0.4"/>
  </g>
  <!-- The lens that reads it. -->
  <circle cx="590" cy="560" r="150" fill="#ffffff" fill-opacity="0.55" stroke="#ff6b5e" stroke-width="44"/>
  <line x1="700" y1="672" x2="790" y2="764" stroke="#ff6b5e" stroke-width="60" stroke-linecap="round"/>
</svg>
