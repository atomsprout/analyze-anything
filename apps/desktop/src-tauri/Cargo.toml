[package]
name = "aa-desktop"
description = "Analyze Anything: the desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aa-app = { workspace = true, features = ["pdf"] }
aa-core.workspace = true
aa-export.workspace = true
aa-report = { path = "../../../crates/aa-report", default-features = false }
aa-worker.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[[bin]]
name = "analyze-anything-desktop"
path = "src/main.rs"
