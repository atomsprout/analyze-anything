# Licence and advisory policy. GPL-family licences are deliberately absent: see docs/PLAN.md.
[licenses]
allow = ["MPL-2.0", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "Unlicense",
    # Permissive licences of the bzip2 and PPMd decoders.
    "bzip2-1.0.6", "MIT-0",
    # The list of root certificates (data, not code) that `aa interpret` trusts when it connects.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Each entry was read and judged not to apply to how this program uses the crate.
[advisories]
ignore = [
    # Timing side channels on operations with secret keys. This program only verifies signatures
    # with public keys read from the files it analyzes; it holds no secret key.
    { id = "RUSTSEC-2023-0071", reason = "rsa: affects private-key operations; only public-key verification is used" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint: affects arithmetic on secrets; only public values are handled" },
    # quick-xml 0.38 is reached only through Typst's bibliography support, which the report
    # template never uses, so no XML reaches it. Files under analysis are parsed with quick-xml 0.42.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via typst bibliography code that is never given input" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via typst bibliography code that is never given input" },
    # Unmaintained crates pulled in by Typst. None parses data taken from an analyzed file.
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust: unmaintained, transitive through typst, unused by the template" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained, transitive through typst, unused by the template" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro, build time only" },
    { id = "RUSTSEC-2025-0141", reason = "bincode: unmaintained, transitive through typst's syntax-highlighting data" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, parses the embedded fonts and fonts the user passes" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained proc-macro, build time only, through the desktop app's GTK bindings on Linux" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, shapes text with the embedded fonts" },
]
