name: Release

# Builds the CLI for each platform and the Windows x64 desktop packages. The workflow attaches
# the unsigned archives and their SHA-256 sums to a draft release. Signed and notarized macOS
# packages are built with tools/release/macos.sh.
on:
  # A run without a version builds and packages every target and stops: a rehearsal.
  # With a version it also creates the draft release, tagging the commit it ran on.
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release as, e.g. v0.1.0. Leave empty for a rehearsal."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    env:
      # The version being released, or the branch name for a rehearsal.
      RELEASE_NAME: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the version; add the target this job builds for.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p aa-cli
        env:
          # The Windows CLI ZIP must run without a separate Visual C++ runtime installation.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      - name: Self-test the built program
        run: target/${{ matrix.target }}/release/analyze-anything selftest
      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          name="analyze-anything-${RELEASE_NAME//\//-}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/analyze-anything" README.md LICENSE NOTICE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "analyze-anything-$($env:RELEASE_NAME -replace '/', '-')-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/analyze-anything.exe", "README.md", "LICENSE", "NOTICE" $name
          Compress-Archive $name "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
      - name: Self-test the packaged Windows CLI
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $name = "analyze-anything-$($env:RELEASE_NAME -replace '/', '-')-${{ matrix.target }}"
          $expected = (Get-Content "$name.zip.sha256").Split(' ')[0]
          if ((Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() -ne $expected) {
            throw 'Packaged CLI checksum mismatch'
          }
          $unpacked = Join-Path $env:RUNNER_TEMP 'aa-packaged-cli'
          Expand-Archive -LiteralPath "$name.zip" -DestinationPath $unpacked
          & (Join-Path $unpacked "$name/analyze-anything.exe") selftest
      - uses: actions/upload-artifact@v4
        with:
          name: analyze-anything-${{ matrix.target }}
          path: |
            analyze-anything-*.tar.gz
            analyze-anything-*.zip
            analyze-anything-*.sha256
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build Windows desktop packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/release/windows.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: analyze-anything-desktop-windows-x64
          if-no-files-found: error
          path: |
            dist/release/windows-*/*.zip
            dist/release/windows-*/*.exe
            dist/release/windows-*/SHA256SUMS

  linux-runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: analyze-anything-${{ matrix.target }}
      # These containers have no Rust toolchain or runner libraries. Test the archive users receive.
      - name: Verify and self-test in clean Linux userspaces
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c ./*.sha256
          mkdir unpacked
          tar xzf ./*.tar.gz -C unpacked --strip-components=1
          for image in ubuntu:24.04 debian:trixie-slim; do
            docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev \
              -v "$PWD/unpacked:/opt/aa:ro" "$image" /opt/aa/analyze-anything selftest
          done

  release:
    needs: [build, linux-runtime]
    if: inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            **/analyze-anything-*
            **/SHA256SUMS
