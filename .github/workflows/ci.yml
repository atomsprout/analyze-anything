name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be checked on all three systems before a pull request exists.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/formats/check.py
      - run: python -m unittest discover -s tools/release -p test_verify_published.py
      # rust-toolchain.toml names the version; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The command line without its optional parts must still build.
      - run: cargo build -p aa-cli --no-default-features
      - name: Check the executable analysis/query/agent workflow without AI
        run: python tools/release/check-workflow.py "target/debug/analyze-anything${{ runner.os == 'Windows' && '.exe' || '' }}" --record executable-workflow.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executable-workflow-${{ runner.os }}
          path: executable-workflow.json
          if-no-files-found: warn

  # The desktop app is outside the workspace's default members.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run fixture
      - run: npm run test:browser
      - run: cargo clippy -p aa-desktop --all-targets -- -D warnings
      - run: cargo test -p aa-desktop
      - name: Compare Windows WebView2 desktop exports with the CLI
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p aa-desktop -p aa-cli -F tauri/custom-protocol
          $slow = Join-Path $env:RUNNER_TEMP 'aa-desktop-slow.bin'
          $file = [IO.File]::Create($slow)
          try { $file.SetLength(1GB) } finally { $file.Dispose() }
          python -u tools/desktop-check/check.py target/debug/analyze-anything-desktop.exe target/debug/analyze-anything.exe crates/aa-windows/tests/data/native-actions.msi crates/aa-unpack/tests/data/sample.tar.gz --slow $slow --timeout 300
      - name: Compare Linux WebKitGTK desktop exports with the CLI
        if: runner.os == 'Linux'
        working-directory: .
        env:
          CARGO_BUILD_JOBS: 2
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cargo build --locked -p aa-desktop -p aa-cli -F tauri/custom-protocol
          slow="$RUNNER_TEMP/aa-desktop-slow.bin"
          truncate -s 1G "$slow"
          dbus-run-session -- xvfb-run -a python3 -u tools/desktop-check/check.py target/debug/analyze-anything-desktop target/debug/analyze-anything crates/aa-windows/tests/data/native-actions.msi crates/aa-unpack/tests/data/sample.tar.gz --slow "$slow" --timeout 300

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
