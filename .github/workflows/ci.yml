name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a branch be checked on all three systems before a pull request exists.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the version; rustup installs it on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The command line without its optional parts must still build.
      - run: cargo build -p aa-cli --no-default-features

  # The desktop app is outside the workspace's default members.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install webkit chromium
      - run: npm run fixture
      - run: npm run test:browser
      - run: cargo clippy -p aa-desktop --all-targets -- -D warnings
      - name: Compare Windows WebView2 desktop exports with the CLI
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p aa-desktop -p aa-cli -F tauri/custom-protocol
          $slow = Join-Path $env:RUNNER_TEMP 'aa-desktop-slow.bin'
          $file = [IO.File]::Create($slow)
          try { $file.SetLength(1GB) } finally { $file.Dispose() }
          python -u tools/desktop-check/check.py target/debug/analyze-anything-desktop.exe target/debug/analyze-anything.exe crates/aa-unpack/tests/data/sample.zip crates/aa-unpack/tests/data/sample.tar.gz --slow $slow --timeout 300

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
