name: Native comparison

# Checks results against the tools that ship with macOS and Windows. Started by hand: it
# downloads a sample and takes a while, so it is not part of every push.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Reference-tool jobs to run
        type: choice
        options: [all, linux]
        default: all

permissions:
  contents: read

jobs:
  macos:
    if: inputs.platform != 'linux'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p aa-cli --no-default-features
      - run: python3 tools/native-compare/macos.py target/release/analyze-anything

  windows:
    if: inputs.platform != 'linux'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p aa-cli --no-default-features
      - run: python tools/native-compare/windows.py target\release\analyze-anything.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpm rpm2cpio python3-rpm libarchive-tools zstd binutils desktop-file-utils appstream
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p aa-cli --no-default-features
      - run: >-
          /usr/bin/python3 tools/native-compare/ar.py --cli target/debug/analyze-anything
          --record out/native-linux/ar-reference.json
          crates/aa-linux/tests/data/native-gnu.a crates/aa-linux/tests/data/native-bsd.a
          crates/aa-linux/tests/data/upstream-libxxhash-0.8.1.a
      - run: >-
          /usr/bin/python3 tools/native-compare/arch-packages.py target/debug/analyze-anything
          crates/aa-linux/tests/data/libutf8proc-2.12.0-1-x86_64.pkg.tar.zst
          --record out/native-linux/arch-reference.json
      - run: >-
          /usr/bin/python3 tools/native-compare/linux-declarations.py target/debug/analyze-anything
          --native --record out/native-linux/declarations-reference.json
      - run: /usr/bin/python3 tools/native-compare/linux-package-fixtures.py out/native-linux
      - run: >-
          /usr/bin/python3 tools/native-compare/linux-packages.py
          target/debug/analyze-anything crates/aa-linux/tests/data/*.deb
          crates/aa-linux/tests/data/*.rpm out/native-linux/*.deb out/native-linux/*.rpm
          --record out/native-linux/reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-package-reference
          path: out/native-linux/
