[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
# The desktop app is built on request (`-p aa-desktop`): it needs a web view and, on Linux,
# system packages that the command line does not.
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0-preview.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/atomsprout/analyze-anything"

[workspace.dependencies]
aa-core = { path = "crates/aa-core" }
aa-engine = { path = "crates/aa-engine" }
aa-unpack = { path = "crates/aa-unpack" }
aa-content = { path = "crates/aa-content" }
aa-binary = { path = "crates/aa-binary" }
aa-apple = { path = "crates/aa-apple" }
aa-windows = { path = "crates/aa-windows" }
aa-android = { path = "crates/aa-android" }
aa-linux = { path = "crates/aa-linux" }
aa-correlate = { path = "crates/aa-correlate" }
aa-export = { path = "crates/aa-export" }
aa-interpret = { path = "crates/aa-interpret" }
aa-deep = { path = "crates/aa-deep" }
aa-worker = { path = "crates/aa-worker" }
aa-app = { path = "crates/aa-app", default-features = false }
memmap2 = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
infer = "0.22"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# Duplicate-name metadata prevents a collapsed ZIP entry from appearing unique.
zip = { version = "9.7", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "deflate64", "lzma", "xz"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = "0.16"
ruzstd = "0.9"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd", "deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# `chunks_exact(2)` over byte buffers reads as what it does; the `as_chunks` form is no safer here.
chunks_exact_to_as_chunks = "allow"

[profile.release]
# Arithmetic on values read from hostile files must not wrap silently into a wrong number: an
# overflow panics, the engine catches it, and the report records a limitation.
overflow-checks = true
lto = "thin"
codegen-units = 1
strip = true
