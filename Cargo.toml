[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/atomsprout/analyze-anything"

[workspace.dependencies]
aa-core = { path = "crates/aa-core" }
aa-engine = { path = "crates/aa-engine" }
aa-report = { path = "crates/aa-report" }
aa-unpack = { path = "crates/aa-unpack" }
aa-content = { path = "crates/aa-content" }
aa-binary = { path = "crates/aa-binary" }
aa-apple = { path = "crates/aa-apple" }
aa-windows = { path = "crates/aa-windows" }
aa-android = { path = "crates/aa-android" }
aa-correlate = { path = "crates/aa-correlate" }
aa-export = { path = "crates/aa-export" }
rayon = "1"
memmap2 = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
infer = "0.22"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "deflate64", "lzma", "xz"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = "0.16"
ruzstd = "0.9"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd", "deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
