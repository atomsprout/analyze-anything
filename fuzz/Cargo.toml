[package]
name = "aa-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aa-engine = { path = "../crates/aa-engine" }

# A workspace of its own: fuzzing needs a nightly toolchain, the main workspace does not.
[workspace]

[[bin]]
name = "analyze"
path = "fuzz_targets/analyze.rs"
test = false
doc = false
bench = false
